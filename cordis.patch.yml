# dsh bundle patch: inserts this plugin into a profile's layer stack.
#
# The default configuration is STANDALONE: no control configuration is
# supplied, so the transport publishes `evalControlStatus` and mounts
# nothing. Activation reports the status instead of failing, and no model
# call is redirected.
#
# To mount the full control stack, give the transport a configuration and
# append the control row AFTER it (order is not cosmetic: the control
# plugin injects `evalBroker`, which only this transport provides):
#
#   - insert:
#       - id: aeval-broker-transport
#         name: './dist/sandbox_entry.js'
#         config:
#           controlConfigPath: '/abs/path/control-config.json'
#       - id: aeval-eval-control
#         name: './dist/index.js'
#         config:
#           controlConfigPath: '/abs/path/control-config.json'
#
# `AEVAL_CONTROL_CONFIG` names the same file for both rows and lets the
# default patch stay untouched; the aeval runner writes its own patch with
# the full inline configuration instead, and does not use this file.
- insert:
    - id: aeval-broker-transport
      name: './dist/sandbox_entry.js'
      config: {}